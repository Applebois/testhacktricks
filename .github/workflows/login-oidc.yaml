name: Run Azure Login with OIDC
on: [push]

permissions:
  id-token: write
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'Az CLI login'
        uses: azure/login@v1
        with:
          client-id: 94aa97c6-3018-467e-8329-a7710b0a7638
          tenant-id: fdd066e1-ee37-49bc-b08f-d0e152119b04
          subscription-id: e6fa68f2-0cca-46f4-a8e0-cb089f1bc4cb

      - name: 'Run az commands'
        run: |
          az account show
          az group list
