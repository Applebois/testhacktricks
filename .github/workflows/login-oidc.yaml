name: Azure UAMI OIDC Login

on:
  push:
    branches:
      - main

jobs:
  azure-oidc-auth:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required to request the OIDC token
      contents: read

    env:
      TENANT_ID: fdd066e1-ee37-49bc-b08f-d0e152119b04
      CLIENT_ID: 94aa97c6-3018-467e-8329-a7710b0a7638  # UAMI client ID

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Request GitHub OIDC token
        id: get_oidc_token
        run: |
          echo "Requesting OIDC token from GitHub..."
          TOKEN=$(curl -sLS $ACTIONS_ID_TOKEN_REQUEST_URL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Exchange OIDC token for Azure access token
        id: exchange_token
        run: |
          echo "Exchanging OIDC token for Azure access token..."
          RESPONSE=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=$CLIENT_ID" \
            -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
            -d "requested_token_use=on_behalf_of" \
            -d "subject_token=${{ steps.get_oidc_token.outputs.token }}" \
            -d "scope=https://management.azure.com/.default" \
            -d "audience=api://AzureADTokenExchange")
          
          ACCESS_TOKEN=$(echo $RESPONSE | jq -r '.access_token')
          if [ "$ACCESS_TOKEN" == "null" ]; then
            echo "Token exchange failed:"
            echo $RESPONSE
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: Use Azure access token (test)
        run: |
          echo "Calling Azure API using access token..."
          curl -s -X GET "https://management.azure.com/subscriptions?api-version=2020-01-01" \
            -H "Authorization: Bearer ${{ steps.exchange_token.outputs.access_token }}" \
            -H "Content-Type: application/json"
